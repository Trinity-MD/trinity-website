name: Deploy Trinity Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: trinity-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -se' <<'EOF'

          set -euo pipefail

          cd /home/ubuntu/infra/projetos/trinity-site/html

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          cd /home/ubuntu/infra/projetos

          docker compose build trinity_site
          docker compose up -d trinity_site

          for i in {1..10}; do
          if curl -fsS http://127.0.0.1:3014/ >/dev/null; then
            echo "Site respondeu com sucesso."
            exit 0
          fi

          echo "Aguardando o container responder... tentativa $i/10"
          sleep 2
          done

          echo "Site não respondeu após 10 tentativas."
          docker logs --tail 100 trinity_site_web
          exit 1

          docker compose ps trinity_site
          EOF