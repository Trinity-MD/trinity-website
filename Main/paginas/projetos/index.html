<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Mídia Digital | Soluções em Desenvolvimento Web e Marketing</title>
    <meta name="description" content="Trinity Mídia Digital: Soluções digitais completas que transformam ideias em realidade tecnológica. Desenvolvimento Web, Marketing Digital e Criação de Conteúdo.">
    <meta name="keywords" content="mídia digital, desenvolvimento web, marketing digital, trinity, criação de sites, SEO, realidade digital">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="canonical" href="https://www.trinityds.com.br/projetos">
    <link rel="shortcut icon" href="/Imagens/Logo Sem Background.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body class="opacity-0 transition-opacity duration-500">
<canvas id="canvas-bg" class="fixed inset-0 z-[-1] w-full h-full pointer-events-none"></canvas>

    <main class="container mx-auto px-4 pb-24 pt-6 md:pt-12">
            
        <div class="relative flex flex-col md:flex-row items-center justify-center mb-12 pb-8 border-b border-white/5">

            <div class="self-start md:absolute md:left-0 md:top-1/2 md:-translate-y-1/2 mb-6 md:mb-0">
                <a href="/" class="flex items-center gap-2 text-gray-400 hover:text-cyan-400 transition-colors duration-300 group px-4 py-2 rounded-lg hover:bg-white/5">
                    <div class="p-1 rounded-full border border-white/10 group-hover:border-cyan-400/50 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                    </div>
                    <span class="text-sm font-medium tracking-wide uppercase" data-i18n="btn_back">Voltar</span>
                </a>
            </div>

            <div class="text-center">
                <h1 class="text-3xl md:text-5xl font-black uppercase text-white tracking-tight relative inline-block">
                    <span class="relative z-10" data-i18n="projects_title">NOSSOS PROJETOS</span>
                    <span class="absolute -inset-1 bg-cyan-500/20 blur-xl z-0 rounded-full"></span>
                </h1>
                <div class="mt-2 h-1 w-24 bg-gradient-to-r from-transparent via-cyan-500 to-transparent mx-auto"></div>
            </div>
        </div>

            <!-- BARRA DE PESQUISA E FILTROS -->
                <div class="max-w-lg mx-auto relative group mt-4 mb-8">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-500 group-focus-within:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="project-search" 
                           class="block w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 focus:bg-white/10 transition-all" 
                           placeholder="Pesquisar projetos..." 
                           data-i18n="search_placeholder">
                </div>

                <!-- VERSÃO DESKTOP (Lista Centralizada Fixa) -->
                <div class="hidden md:flex justify-center flex-wrap gap-3 mt-4 mb-12">
                    <button class="filter-btn px-4 py-2 rounded-lg border border-cyan-500 bg-cyan-500/20 text-white text-sm font-medium transition-all hover:bg-cyan-500/30" data-filter="all" data-i18n="filter_all">Todos</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white" data-filter="apps" data-i18n="filter_apps">Apps</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white" data-filter="plataformas" data-i18n="filter_platforms">Plataformas Web</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white" data-filter="sites" data-i18n="filter_sites">Sites</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white" data-filter="outros" data-i18n="filter_others">Outros</button>
                </div>

                <!-- VERSÃO MOBILE (Carrossel Infinito Swiper) -->
                <div class="filter-swiper-container relative px-0 md:hidden mb-16">

                    <div class="absolute left-0 top-0 bottom-0 w-8 bg-gradient-to-r from-[#020617] to-transparent z-10 pointer-events-none"></div>
                    <div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-[#020617] to-transparent z-10 pointer-events-none"></div>
                    <div class="absolute right-0 top-0 bottom-0 w-12 animate-side-pulse z-10 pointer-events-none"></div>

                    <div class="swiper filter-swiper">
                        <div class="swiper-wrapper">
                            
                            <div class="swiper-slide px-2">
                                <button class="filter-btn px-6 py-2 rounded-lg border border-cyan-500 bg-cyan-500/20 text-white text-sm font-medium transition-all hover:bg-cyan-500/30 w-full" data-filter="all" data-i18n="filter_all">Todos</button>
                            </div>
                            <div class="swiper-slide px-2">
                                <button class="filter-btn px-6 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white w-full" data-filter="apps" data-i18n="filter_apps">Apps</button>
                            </div>
                            <div class="swiper-slide px-2">
                                <button class="filter-btn px-6 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white w-full" data-filter="plataformas" data-i18n="filter_platforms">Plataformas Web</button>
                            </div>
                            <div class="swiper-slide px-2">
                                <button class="filter-btn px-6 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white w-full" data-filter="sites" data-i18n="filter_sites">Sites</button>
                            </div>
                            <div class="swiper-slide px-2">
                                <button class="filter-btn px-6 py-2 rounded-lg border border-white/10 text-gray-400 text-sm font-medium transition-all hover:border-cyan-500/50 hover:text-white w-full" data-filter="outros" data-i18n="filter_others">Outros</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-12 mt-2">
            
            <!-- PROJETO 1: TRANSPORTA -->
            <div data-href="/projetos/transporta" class="card cursor-pointer project-item" data-category="apps plataformas">
                <div class="content" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                    <img src="/Imagens/Transporta-Icon.png" alt="Transporta APP">
                    <h3 class="heading">Transporta APP</h3>
                    <p class="para" data-i18n="project_1_desc">
                        Plataforma Web e Aplicativo Android integrados.
                    </p>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer-shell">
        <div class="flex flex-col md:flex-row justify-center items-center gap-6">
            <div class="text-center space-y-2">
                <p class="text-xs text-gray-500 max-w-2xl mx-auto leading-relaxed">
                    <span class="font-semibold text-gray-400 mt-4">Trinity Digital Solutions</span> 
                    <span data-i18n="footer_legal_text">é uma marca comercial e de apresentação da</span> 
                    <span class="text-gray-300 mt-4">Trinity Midia Digital e Tecnologia LTDA</span>.
                </p>
                <p class="text-xs text-gray-600 font-mono mt-4">
                    CNPJ: 62.720.421/0001-44 &bull; &copy; <span id="current-year">2025</span> 
                    <span data-i18n="footer_rights">Todos os direitos reservados.</span>
                </p>
            </div>
        </div>
    </footer>

    <script src="/js/ui.js" defer></script>
    <script type="module" src="/js/main.js" defer></script>
    <script src="/js/background.js" defer></script> <script type="module" src="/js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>
</html>
