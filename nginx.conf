server {
    listen 80;
    server_name localhost;
    
    # Define a pasta raiz onde o Docker colocou seus arquivos
    root /usr/share/nginx/html;
    index index.html;

    # O protocolo público é controlado pelo proxy externo.
    # Redirects relativos preservam HTTPS sem depender do $scheme da origem.
    absolute_redirect off;

    # Tenta carregar o arquivo exato, depois tenta como pasta, depois tenta adicionar .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # URLs canônicas: servir os HTMLs sem expor seus caminhos físicos.
    location = / {
        try_files /index.html =404;
    }
    location = /projetos {
        try_files /paginas/projetos/index.html =404;
    }
    location = /sobre {
        try_files /paginas/sobre/index.html =404;
    }
    location = /contato {
        try_files /paginas/contato/index.html =404;
    }
    location = /projetos/transporta {
        try_files /paginas/projetos/transporta/index.html =404;
    }

    # Aliases conhecidos: um único redirect, preservando a query string.
    location = /index.html {
        return 301 /$is_args$args;
    }
    location ~ ^/(projetos/|paginas/projetos(?:/|/index\.html)?)$ {
        return 301 /projetos$is_args$args;
    }
    location ~ ^/(sobre/|paginas/sobre(?:/|/index\.html)?)$ {
        return 301 /sobre$is_args$args;
    }
    location ~ ^/(contato/|paginas/contato(?:/|/index\.html)?)$ {
        return 301 /contato$is_args$args;
    }
    location ~ ^/(projetos/transporta/|paginas/projetos/transporta(?:/|/index\.html)?)$ {
        return 301 /projetos/transporta$is_args$args;
    }

    # Redirecionamento da rota técnica antiga.
    location ~ ^/projetos/transporta/tecnica/?$ {
        return 301 /projetos/transporta$is_args$args;
    }


    # === PÁGINA DE ERRO ===
    error_page 404 /404.html;
    location = /404 {
        return 404;
    }
    location = /404.html {
        internal;
    }
}
